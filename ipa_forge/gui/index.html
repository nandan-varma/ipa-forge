<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ipa-forge — Patch an IPA</title>
    <style>
      :root {
        --accent: #0071e3;
        --accent-hover: #0077ed;
        --accent-press: #0068d6;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #1d1d1f;
        --text-secondary: #6e6e73;
        --border: rgba(0, 0, 0, 0.12);
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        --success: #34c759;
        --danger: #ff3b30;
        --success-bg: rgba(52, 199, 89, 0.12);
        --danger-bg: rgba(255, 59, 48, 0.12);
        --danger-border: rgba(255, 59, 48, 0.5);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --card: #1c1c1e;
          --text: #f5f5f7;
          --text-secondary: #98989d;
          --border: rgba(255, 255, 255, 0.16);
          --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
          --accent: #0a84ff;
          --accent-hover: #3a9bff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 32px;
        width: 100%;
        max-width: 460px;
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
      .drop {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 28px 16px;
        text-align: center;
        color: var(--text-secondary);
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
        font-size: 14px;
      }
      .drop.dragover, .drop:hover { border-color: var(--accent); color: var(--text); }
      .drop .file-name { color: var(--text); font-weight: 600; word-break: break-all; }
      .drop input { display: none; }
      .status {
        margin-top: 16px;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
        display: none;
      }
      .status.error { display: block; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }
      .status.info { display: block; background: var(--success-bg); border: 1px solid rgba(52,199,89,0.5); color: var(--success); }
      .status.warn { display: block; background: rgba(255,149,0,0.12); border: 1px solid rgba(255,149,0,0.5); color: #ff9500; }
      .status.warn b { color: var(--text); }
      .detected { display: none; margin-top: 16px; font-size: 13px; }
      .detected.show { display: block; }
      .detected .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .detected .row:last-child { border-bottom: none; }
      .detected .k { color: var(--text-secondary); }
      .detected .v { font-weight: 600; }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: var(--accent-hover); }
      button:active { background: var(--accent-press); }
      button:disabled { opacity: 0.5; cursor: default; }
      .footnote { margin-top: 14px; color: var(--text-secondary); font-size: 12px; text-align: center; }
      .download { margin-top: 14px; text-align: center; }
      .download a { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ipa-forge</h1>
      <p class="subtitle">Select an IPA to patch it with the matching patch set. Output is unsigned — ready for AltStore.</p>

      <div class="drop" id="drop">
        <span id="dropText">Click or drop your .ipa file here</span>
        <input type="file" id="file" accept=".ipa" />
      </div>

      <div class="status" id="status"></div>

      <div class="detected" id="detected">
        <div class="row"><span class="k">App</span><span class="v" id="dApp">–</span></div>
        <div class="row"><span class="k">Version</span><span class="v" id="dVersion">–</span></div>
        <div class="row"><span class="k">Patch set</span><span class="v" id="dPatchSet">–</span></div>
        <div class="row"><span class="k">Targets</span><span class="v" id="dTarget">–</span></div>
      </div>

      <button id="patchBtn" disabled>Patch</button>

      <div class="download" id="download"></div>
      <p class="footnote">version mismatch shows a warning but patching still runs — hook verification is the safety net.</p>
    </div>

    <script>
      const fileInput = document.getElementById("file");
      const drop = document.getElementById("drop");
      const dropText = document.getElementById("dropText");
      const status = document.getElementById("status");
      const detected = document.getElementById("detected");
      const patchBtn = document.getElementById("patchBtn");
      const download = document.getElementById("download");

      let currentFile = null;
      let currentPatchSet = null;

      function showStatus(kind, html) {
        status.className = "status " + kind;
        status.innerHTML = html;
      }

      function setDetected(app, version, patchSet, target) {
        detected.classList.add("show");
        document.getElementById("dApp").textContent = app || "–";
        document.getElementById("dVersion").textContent = version || "–";
        document.getElementById("dPatchSet").textContent = patchSet || "none found";
        document.getElementById("dTarget").textContent = target || "–";
      }

      async function analyze(file) {
        showStatus("info", "Analyzing…");
        download.innerHTML = "";
        const fd = new FormData();
        fd.append("ipa", file);
        const res = await fetch("/detect", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) {
          showStatus("error", data.error || "Could not read the IPA.");
          patchBtn.disabled = true;
          return;
        }
        const ps = data.patch_sets || [];
        currentPatchSet = ps[0] ? ps[0].name : null;
        setDetected(data.bundle_id, data.version, currentPatchSet || "none", ps[0] ? ps[0].target_version : "–");

        if (!ps.length) {
          showStatus("error", "No patch set found for <b>" + (data.bundle_id || "this app") + "</b>.");
          patchBtn.disabled = true;
        } else if (data.mismatch) {
          showStatus(
            "warn",
            "Heads up: this patch set targets <b>" + ps[0].target_version + "</b> but your IPA is <b>" +
              data.version + "</b>. The hooks gate will still verify everything — patching is allowed."
          );
          patchBtn.disabled = false;
        } else {
          showStatus("info", "Ready — patch set <b>" + currentPatchSet + "</b> matches.");
          patchBtn.disabled = false;
        }
      }

      drop.addEventListener("click", () => fileInput.click());
      drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("dragover"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          currentFile = e.dataTransfer.files[0];
          dropText.textContent = currentFile.name;
          dropText.classList.add("file-name");
          analyze(currentFile);
        }
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          currentFile = fileInput.files[0];
          dropText.textContent = currentFile.name;
          dropText.classList.add("file-name");
          analyze(currentFile);
        }
      });

      patchBtn.addEventListener("click", async () => {
        if (!currentFile || !currentPatchSet) return;
        patchBtn.disabled = true;
        showStatus("info", "Patching… (a 150 MB IPA takes a few minutes)");
        download.innerHTML = "";
        const fd = new FormData();
        fd.append("ipa", currentFile);
        fd.append("patch_set", currentPatchSet);
        fd.append("no_sign", "true");
        const res = await fetch("/patch", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) {
          showStatus("error", data.error || "Patching failed.");
          patchBtn.disabled = false;
          return;
        }
        const manifest = data.manifest || {};
        const applied = (manifest.patches_applied || []).filter((p) => p.status === "applied").length;
        showStatus("info", "Patched — " + applied + " operation(s) applied.");
        if (data.download_url) {
          download.innerHTML = '<a href="' + data.download_url + '">Download patched IPA</a>';
        }
        patchBtn.disabled = false;
      });
    </script>
  </body>
</html>
