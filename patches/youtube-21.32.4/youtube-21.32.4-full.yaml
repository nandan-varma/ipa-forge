# YouTube 21.32.4 — complete patch set: cosmetic + player ad removal.
#
# Combines the safe resource/plist patches with the from-scratch ad-removal
# hook dylib (see youtube-mod.yaml and dylib/ for details).
#
# Build the dylib first if assets/libYTHook.dylib is missing:
#   dylib/build.sh
target:
  bundle_id: "com.google.ios.youtube"
  version:
    exact: "21.32.4"

patches:
  - id: "rename-display-name"
    type: plist_edit
    action: "set"
    key: "CFBundleDisplayName"
    value: "YouTube (patched)"
    path: "Info.plist"

  - id: "replace-90s-preview-video"
    type: resource_replace
    path: "90s-video.mp4"
    source: "assets/90s-video.mp4"

  # AltStore appends the Team ID to the main bundle id
  # (com.google.ios.youtube.<teamID>); iOS then rejects the embedded
  # extensions because their ids (com.google.ios.youtube.<Name>) no longer
  # match the parent prefix. Same reason the free-account App-ID cap (~3)
  # is blown by 6 extension ids. Stripping the extensions fixes the
  # "Failed to set app extension placeholders" install error (dayanch96's
  # own releases strip them too).
  - id: "remove-app-extensions"
    type: resource_remove
    path: "Extensions"

  - id: "remove-app-plugins"
    type: resource_remove
    path: "PlugIns"

  - id: "stage-hook-dylib"
    type: resource_add
    path: "Frameworks/libYTHook.dylib"
    source: "assets/libYTHook.dylib"

  - id: "link-hook-dylib"
    type: dylib_inject
    executable: "YouTube"
    install_name: "@rpath/libYTHook.dylib"
    load_command: "LC_LOAD_DYLIB"
