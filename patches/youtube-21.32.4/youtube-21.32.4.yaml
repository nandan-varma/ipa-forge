# YouTube 21.32.4 — safe cosmetic/resource patch set.
#
# Validated: forge patch --dry-run against
# /Users/nandan/Downloads/com.google.ios.youtube_544007664_21.32.4.ipa
# reports "2 operation(s) would apply."
#
# This app's executables are thin arm64 -- no arch: field needed.
# The main binary is string-obfuscated, so binary_replace on it is not
# practical without reverse-engineering (see README.md in this directory).
target:
  bundle_id: "com.google.ios.youtube"
  version:
    exact: "21.32.4"

patches:
  - id: "rename-display-name"
    type: plist_edit
    action: "set"
    key: "CFBundleDisplayName"
    value: "YouTube (patched)"
    path: "Info.plist"

  - id: "replace-90s-preview-video"
    type: resource_replace
    path: "90s-video.mp4"
    source: "assets/90s-video.mp4"
