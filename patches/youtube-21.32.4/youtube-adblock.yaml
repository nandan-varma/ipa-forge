# YouTube 21.32.4 — player ad removal via from-scratch hook dylib.
#
# Installable Adblock IPA: this set also strips Extensions/ and PlugIns/,
# which AltStore requires (the parent bundle id gets a Team-ID suffix at
# install, breaking stock extension ids -- see the comment on the remove
# ops below).
#
# libYTHook.dylib is built from dylib/libYTHook.m (see dylib/build.sh) and
# swizzles, at load time via a plain ObjC-runtime constructor:
#   - YTAdBreakResponseReceivedOpportunityAdapterV2
#       didReceiveAdBreakResponse:fromAdBreakSlot:  -> response dropped
#   - YTAdBreakRendererAdapter createAds            -> returns empty array
# Hook targets were verified present in the 21.32.4 binary by static
# analysis (class/method walk of __objc_classlist/__objc_methlist).
#
# No ads are scheduled; the ad-break timeline still resolves (empty), so
# content playback is not left waiting on a missing callback.
#
# Build:   dylib/build.sh
# Dry run: forge patch --ipa <youtube-21.32.4.ipa> --patches this-file --dry-run
target:
  bundle_id: "com.google.ios.youtube"
  version:
    exact: "21.32.4"

patches:
  # AltStore appends the Team ID to the main bundle id at install
  # (com.google.ios.youtube.<teamID>); iOS then rejects the embedded
  # extensions because their ids (com.google.ios.youtube.<Name>) no longer
  # match the parent prefix. Same reason the free-account App-ID cap (~3)
  # is blown by 6 extension ids. Stripping the extensions fixes the
  # "Failed to set app extension placeholders" install error (IXErrorDomain
  # Code=2) -- dayanch96's own releases strip them too.
  - id: "remove-app-extensions"
    type: resource_remove
    path: "Extensions"

  - id: "remove-app-plugins"
    type: resource_remove
    path: "PlugIns"

  - id: "stage-hook-dylib"
    type: resource_add
    path: "Frameworks/libYTHook.dylib"
    source: "assets/libYTHook.dylib"

  - id: "link-hook-dylib"
    type: dylib_inject
    executable: "YouTube"
    install_name: "@rpath/libYTHook.dylib"
    load_command: "LC_LOAD_DYLIB"
