# YouTube 21.32.4 — player ad removal + full feature mod via from-scratch hook dylib.
#
# libYTHook.dylib is built from dylib/*.m (see dylib/build.sh) and swizzles,
# at load time via a plain ObjC-runtime constructor:
#   - ad removal (player/feed/Shorts) — see AdBlock.m
#   - sideload sign-in fix — see SignInFix.m
#   - in-app YTFreedom settings section — see SettingsUI.m
#   - player/gestures/navbar/tabbar/feed/shorts/misc/appearance toggles —
#     see PlayerFeatures.m, PlayerGestures.m, NavbarTabbar.m, FeedShorts.m,
#     MiscFeatures.m, Appearance.m
# Every hook class and selector was verified present in the 21.32.4 binary
# (forge hooks extract/audit + strings) before being ported.
#
# Installable output: this set also strips Extensions/ and PlugIns/, which
# AltStore requires (the parent bundle id gets a Team-ID suffix at install,
# breaking stock extension ids — see the comment on the remove ops below).
#
# Build:   dylib/build.sh
# Dry run: forge patch --ipa <youtube-21.32.4.ipa> --patches this-file --dry-run
target:
  bundle_id: "com.google.ios.youtube"
  version:
    exact: "21.32.4"

patches:
  # AltStore appends the Team ID to the main bundle id at install
  # (com.google.ios.youtube.<teamID>); iOS then rejects the embedded
  # extensions because their ids (com.google.ios.youtube.<Name>) no longer
  # match the parent prefix. Same reason the free-account App-ID cap (~3)
  # is blown by 6 extension ids. Stripping the extensions fixes the
  # "Failed to set app extension placeholders" install error (IXErrorDomain
  # Code=2) -- dayanch96's own releases strip them too.
  - id: "remove-app-extensions"
    type: resource_remove
    path: "Extensions"

  - id: "remove-app-plugins"
    type: resource_remove
    path: "PlugIns"

  - id: "stage-hook-dylib"
    type: resource_add
    path: "Frameworks/libYTHook.dylib"
    source: "assets/libYTHook.dylib"

  - id: "link-hook-dylib"
    type: dylib_inject
    executable: "YouTube"
    install_name: "@rpath/libYTHook.dylib"
    load_command: "LC_LOAD_DYLIB"

