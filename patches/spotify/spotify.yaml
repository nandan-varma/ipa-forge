# Spotify 9.1.72 — essential mod via a from-scratch plain-ObjC dylib.
#
# No Swift, no substrate, no third-party tweak binary: SpotifyHook.dylib is
# built from dylib/*.m (see dylib/build.sh) and loaded via LC_LOAD_DYLIB —
# the same pattern as the YouTube set, which cannot crash at launch the way a
# Swift/Orion dylib loaded this early does.
#
# Essential features (in priority order):
#   1. Sideload shim   — keychain access-group rebind, app-group container,
#                        CloudKit neuter (SideloadFix.m). Without it the
#                        re-signed app can't persist sign-in.
#   2. Session protect — block forced logout (SPTAuthSessionImplementation /
#                        SPTAuthLegacyLoginControllerImplementation) and the
#                        network calls that drive it (SessionProtection.m).
#   3. Premium unlock  — intercept the bootstrap + /v1/customize responses and
#                        rewrite the UcsResponse protobuf: account attributes
#                        -> premium (catalogue/type/player-license/on-demand/
#                        shuffle-eligible/offline/high-bitrate/...), assigned
#                        feature values -> ads off + capping removed. Also
#                        answers the DAC/account-validate/trials endpoints
#                        with canned responses (PremiumPatch.m + PBProto.m).
#
# AltStore appends the Team ID to the main bundle id at install
# (com.spotify.client.<teamID>), breaking the embedded extension/watch ids
# (IXErrorDomain Code=2) — stripping PlugIns/ + Watch/ is required.
target:
  bundle_id: "com.spotify.client"
  version:
    exact: "9.1.72"

patches:
  - id: "remove-plugins"
    type: resource_remove
    path: "PlugIns"

  - id: "remove-watch"
    type: resource_remove
    path: "Watch"

  - id: "stage-hook-dylib"
    type: resource_add
    path: "Frameworks/SpotifyHook.dylib"
    source: "build/SpotifyHook.dylib"

  - id: "link-hook-dylib"
    type: dylib_inject
    executable: "Spotify"
    install_name: "@rpath/SpotifyHook.dylib"
    # weak, like the community Spotify mods — a load failure degrades
    # instead of aborting.
    load_command: "LC_LOAD_WEAK_DYLIB"

# Runtime hooks SpotifyHook.dylib relies on, verified against the 9.1.72
# binary (main executable + SpotifyShared.framework) with `forge hooks verify`.
# required = the feature dies silently if the app version drops it.
hooks:
  # premium unlock — bootstrap/customize response interception
  - class: "SPTDataLoaderService"
    selector: "URLSession:dataTask:didReceiveData:"
    required: true
  - class: "SPTDataLoaderService"
    selector: "URLSession:task:didCompleteWithError:"
    required: true
  - class: "SPTCoreURLSessionDataDelegate"
    selector: "URLSession:dataTask:didReceiveData:"
  - class: "SPTCoreURLSessionDataDelegate"
    selector: "URLSession:task:didCompleteWithError:"
  # session logout protection
  - class: "SPTAuthSessionImplementation"
    selector: "logout"
    required: true
  - class: "SPTAuthSessionImplementation"
    selector: "destroy"
    required: true
  - class: "SPTAuthSessionImplementation"
    selector: "logoutWithReason:"
  - class: "SPTAuthSessionImplementation"
    selector: "callSessionDidLogoutOnDelegateWithReason:"
  - class: "SPTAuthSessionImplementation"
    selector: "logWillLogoutEventWithLogoutReason:"
  - class: "SPTAuthLegacyLoginControllerImplementation"
    selector: "forgetStoredCredentials"
    required: true
  - class: "SPTAuthLegacyLoginControllerImplementation"
    selector: "sessionDidLogout:withReason:"
  - class: "SPTAuthLegacyLoginControllerImplementation"
    selector: "destroySession"
  - class: "SPTAuthLegacyLoginControllerImplementation"
    selector: "invalidate"
  # HUB ad-component filter (sponsored shelves, banners, marquee cards)
  - class: "HUBViewModelBuilderImplementation"
    selector: "addJSONDictionary:"
    required: true
  # network-level logout/ad re-fetch blocking
  - class: "NSURLSessionTask"
    selector: "resume"
    required: true
  # sideload shim (defensive: only fires if the app queries app-group containers)
  - class: "NSFileManager"
    selector: "containerURLForSecurityApplicationGroupIdentifier:"
    required: false
  # tab hiding (TabBarFix.m) — Swift tab bar (NavigationUI_TabBarImpl).
  # TabBarContainer is a UIViewController: items are filtered in
  # setViewControllers:, layout is triggered from viewDidLayoutSubviews.
  - class: "_TtC23NavigationUI_TabBarImpl15TabBarContainer"
    selector: "setViewControllers:"
  - class: "_TtC23NavigationUI_TabBarImpl15TabBarContainer"
    selector: "viewDidLayoutSubviews"
  - class: "_TtC23NavigationUI_TabBarImpl21TabBarItemElementView"
    selector: "didMoveToWindow"
  - class: "_TtC23NavigationUI_TabBarImpl21TabBarItemElementView"
    selector: "layoutSubviews"
  # presence proxy: the Create tab is detected by this view class at runtime;
  # not hooked, but flag drift so the detection silently degrading is visible
  - class: "_TtC22CreateMenu_TabPageImpl24CreateMenuTabBarItemView"
    selector: "didMoveToWindow"
    required: false
