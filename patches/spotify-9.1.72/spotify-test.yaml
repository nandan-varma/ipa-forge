# Spotify 9.1.72 — MINIMAL INJECTION TEST.
#
# Proves the pipeline (strip PlugIns/Watch + stage + weak LC_LOAD_DYLIB)
# works on Spotify 9.1.72 with a dylib that does nothing. If THIS launches,
# the injection is fine and the crash is in the feature hooks; if it crashes
# too, the problem is the injection/strip/signing itself.
target:
  bundle_id: "com.spotify.client"
  version:
    exact: "9.1.72"

patches:
  - id: "remove-plugins"
    type: resource_remove
    path: "PlugIns"

  - id: "remove-watch"
    type: resource_remove
    path: "Watch"

  - id: "stage-test-dylib"
    type: resource_add
    path: "Frameworks/MinimalHook.dylib"
    source: "build-test/MinimalHook.dylib"

  - id: "link-test-dylib"
    type: dylib_inject
    executable: "Spotify"
    install_name: "@rpath/MinimalHook.dylib"
    load_command: "LC_LOAD_WEAK_DYLIB"

hooks: []
