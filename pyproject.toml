[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipa-forge"
version = "0.1.0"
description = "Generic, data-driven iOS IPA patcher framework with AltStore Classic re-signing support"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nandan Varma" }]
keywords = ["ios", "ipa", "codesign", "altstore", "sideloading", "mach-o", "patching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
dependencies = [
    "lief>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/nandanvarma/ipa-forge"
Repository = "https://github.com/nandanvarma/ipa-forge"
Issues = "https://github.com/nandanvarma/ipa-forge/issues"

[project.scripts]
forge = "ipa_forge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ipa_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "macos: requires macOS codesign/security tooling",
]
