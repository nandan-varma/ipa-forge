[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipa-forge"
version = "0.1.0"
description = "Generic, data-driven iOS IPA patcher framework with AltStore Classic re-signing support"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nandan Varma" }]
keywords = [
  "ios",
  "ipa",
  "codesign",
  "altstore",
  "sideloading",
  "mach-o",
  "patching",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Security",
]
dependencies = [
  "lief>=1.0.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5.1",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/nandan-varma/ipa-forge"
Repository = "https://github.com/nandan-varma/ipa-forge"
Issues = "https://github.com/nandan-varma/ipa-forge/issues"

[project.scripts]
forge = "ipa_forge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ipa_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["macos: requires macOS codesign/security tooling"]
addopts = "--cov=ipa_forge --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "TRY"]
# TRY003 wants every long message to live on a dedicated exception subclass;
# this codebase's custom exception classes already carry their own context,
# so the rule only adds noise here.
ignore = ["TRY003"]

# B008 fires on typer.Argument/Option and fastapi.File/Form in argument
# defaults -- the canonical way to declare those frameworks' parameters.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  "fastapi.File",
  "fastapi.Form",
]

[tool.mypy]
python_version = "3.11"
files = ["ipa_forge"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_redundant_casts = true
warn_unused_ignores = true
