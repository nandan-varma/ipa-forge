[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipa-forge"
version = "0.1.0"
description = "Generic, data-driven iOS IPA patcher framework with AltStore Classic re-signing support"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "lief>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
forge = "ipa_forge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ipa_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "macos: requires macOS codesign/security tooling",
]
